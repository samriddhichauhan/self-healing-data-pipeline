server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SelfHeal platform API (same origin; the browser never calls Airflow or Ollama directly).
    location /api/ {
        proxy_pass http://platform-api:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }

    # Existing pipeline backend, READ-ONLY: only GET/HEAD are allowed through.
    # Used for data-quality profiles and per-run quality results.
    location /backend/ {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:8000;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
