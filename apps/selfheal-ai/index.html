<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SelfHeal AI — AI data reliability platform for the self-healing Airflow pipeline." />
    <title>SelfHeal AI</title>
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      (function () {
        var theme = "system";
        try { theme = (JSON.parse(localStorage.getItem("selfheal-ai.settings") || "{}").theme) || "system"; } catch (e) {}
        var dark = theme === "dark" || (theme === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
