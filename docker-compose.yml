# docker-compose.yml — the entire self-healing pipeline stack.
# Single machine, no cloud dependency, no paid external API. LocalExecutor
# Airflow + one Postgres instance (hosting both Airflow's own metadata DB
# and the pipeline's own business DB) + FastAPI backend + React frontend.
#
# Usage:
#   docker compose up -d
#   open http://localhost:8080  (Airflow UI — user: airflow / pass: airflow)
#   open http://localhost:5173  (dashboard)
#   open http://localhost:8000/docs  (backend API)
#
# `docker compose down` / `docker compose up -d` must recover cleanly with
# no manual repair — the Postgres init script and idempotent DDL in
# src/database/schema.py guarantee this on a fresh volume.

x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    PYTHONPATH: /opt/airflow
    PIPELINE_LOGS_DIR: /opt/airflow/pipeline_logs
    PIPELINE_DB_HOST: postgres
    PIPELINE_DB_PORT: '5432'
    PIPELINE_DB_NAME: pipeline
    PIPELINE_DB_USER: airflow
    PIPELINE_DB_PASSWORD: airflow
    OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      pandas
      pyyaml
      psycopg2-binary
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/config:/opt/airflow/config
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/pipeline_logs
    - ./src:/opt/airflow/src
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Air --lastname Flow \
          --role Admin --email airflow@example.com
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    volumes:
      - ./airflow:/sources

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      TEST_DATA_DIR: /app/data
      PIPELINE_LOGS_DIR: /app/logs
      PIPELINE_DB_HOST: postgres
      PIPELINE_DB_PORT: '5432'
      PIPELINE_DB_NAME: pipeline
      PIPELINE_DB_USER: airflow
      PIPELINE_DB_PASSWORD: airflow
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres-db-volume:
